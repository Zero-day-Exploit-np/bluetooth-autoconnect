site_name: bluetooth-autoconnect
site_description: BlueZ-powered Bluetooth auto-connect daemon
site_url: https://example.github.io/bluetooth-autoconnect/
repo_url: https://github.com/example/bluetooth-autoconnect
nav:
  - Home: index.md
  - Installation: INSTALL.md
  - API Reference: api.md
  - Developer Guide: developer-guide.md
  - Troubleshooting: TROUBLESHOOTING.md
  - FAQ: faq.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
theme:
  name: material
markdown_extensions:
  - admonition
  - tables
  - attr_list
