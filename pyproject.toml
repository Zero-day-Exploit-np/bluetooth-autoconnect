[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetooth-autoconnect"
dynamic = ["version"]
description = "Automatically detect and reconnect paired, trusted Bluetooth devices via BlueZ D-Bus."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "bluetooth-autoconnect contributors" },
]
keywords = ["bluetooth", "bluez", "dbus", "linux", "autoconnect", "systemd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "dbus-next>=0.2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
journal = ["systemd-python>=235"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "black>=24.8",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "safety>=3.2",
    "coverage[toml]>=7.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/example/bluetooth-autoconnect"
Documentation = "https://example.github.io/bluetooth-autoconnect/"
Repository = "https://github.com/example/bluetooth-autoconnect"
Issues = "https://github.com/example/bluetooth-autoconnect/issues"
Changelog = "https://github.com/example/bluetooth-autoconnect/releases"

[project.scripts]
bluetooth-autoconnect = "bluetooth_autoconnect.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "bluetooth_autoconnect.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bluetooth_autoconnect*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=bluetooth_autoconnect --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["bluetooth_autoconnect"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102", "D203", "D212"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
targets = ["bluetooth_autoconnect"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "python -m build"
commit_message = "chore(release): {version}"
